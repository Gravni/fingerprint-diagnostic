<!doctype html><meta charset="utf-8"><title>fingerprint probe</title>
<style>
  body{font:13px ui-monospace,Menlo,monospace;background:#0d1117;color:#c9d1d9;margin:0;padding:24px}
  h3{margin:0 0 4px} p{margin:4px 0 14px;color:#8b949e}
  #log{white-space:pre-wrap;line-height:1.7}
  .ok{color:#3fb950}.err{color:#f85149}.big{font-size:15px;color:#58a6ff}
</style>
<h3>Сбор браузерного отпечатка</h3>
<p>Считываем всё, что браузер отдаёт сайтам. Ничего не нажимай — идёт само, 20-40 сек.</p>
<div id="log"></div>
<script>
/* ============================================================================
   Глубокий сборщик отпечатка.

   Пишется ОДИН раз как функция COLLECTOR(root). Для воркеров/воркета её
   исходник берётся через .toString() — копии в строке больше нет, править
   нужно одно место.

   Два принципа:
   1. Полнота. Помимо точечных активных замеров (canvas/webgl/audio/шрифты)
      идёт РЕКУРСИВНЫЙ обход navigator/window/screen/document со ЗНАЧЕНИЯМИ
      каждого свойства. Это ловит любой утёкший параметр, даже неизвестный
      заранее — ровно то, что антик может «забыть» прикрыть.
   2. Все контексты. Тот же код гоняется в window, воркерах и audio-worklet:
      расхождение между контекстами внутри одного браузера — самый дешёвый
      признак для детекта, и именно там дырявы дешёвые антики.
   ========================================================================= */
function COLLECTOR(root){
  'use strict';

  var S=function(fn){ try{ var v=fn(); return v===undefined?'undef':v; }catch(e){ return 'ERR:'+e.name; } };
  var A=function(fn){ return Promise.resolve().then(fn).then(function(v){return v===undefined?'undef':v;},function(e){return 'ERR:'+e.name;}); };

  // FNV-1a — синхронный детерминированный хеш, работает во всех realms (в т.ч.
  // audio-worklet, где нет crypto.subtle). Оставляем как universal fallback.
  function hash(s){ var h=0x811c9dc5; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=(h+((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)))>>>0; } return ('00000000'+h.toString(16)).slice(-8); }

  // SHA-256 через crypto.subtle (secure context; есть в window и воркерах, нет в
  // audio-worklet). Возвращает hex или null, если недоступно — тогда берём FNV.
  function sha256(input){
    return A(function(){
      try{
        var buf = (typeof input==='string') ? new TextEncoder().encode(input)
                : (input && input.buffer ? input : new Uint8Array(input));
        if(!(root.crypto && root.crypto.subtle)) return null;
        return root.crypto.subtle.digest('SHA-256', buf).then(function(d){
          var a=new Uint8Array(d), s=''; for(var i=0;i<a.length;i++) s+=('0'+a[i].toString(16)).slice(-2); return s;
        }, function(){ return null; });
      }catch(e){ return null; }
    });
  }

  /* ---- ядро: рекурсивный обход объекта со ЗНАЧЕНИЯМИ ------------------- */
  var NOISE={__proto__:1,__defineGetter__:1,__defineSetter__:1,__lookupGetter__:1,
    __lookupSetter__:1,constructor:1,hasOwnProperty:1,isPrototypeOf:1,
    propertyIsEnumerable:1,toLocaleString:1,toString:1,valueOf:1,toJSON:1};
  var MAX_DEPTH=4, MAX_LEAVES=6000, MAX_ARR=20000;

  // Only VALUE leaves. Functions are NOT values (their shape is captured
  // separately as a compact _fns inventory), arrays are captured whole, and raw
  // strings are NEVER truncated (a 512-char cut destroyed fonts/voices/exts).
  function leaf(v){
    var t=typeof v;
    if(v===null) return 'null';
    if(t==='undefined') return 'undef';
    if(t==='string') return v;
    if(t==='number'||t==='boolean'||t==='bigint') return String(v);
    if(t==='symbol') return v.toString();
    return null; // object/function — handled by caller
  }

  function walk(rootObj, label, maxDepth){
    var out={}, leaves=0, seen=(typeof WeakSet!=='undefined')?new WeakSet():null;
    var md=maxDepth||MAX_DEPTH;
    function rec(obj, path, depth){
      if(leaves>=MAX_LEAVES) return;
      if(obj===null || (typeof obj!=='object' && typeof obj!=='function')) return;
      if(seen){ if(seen.has(obj)) return; seen.add(obj); }
      var names={};
      for(var o=obj,d=0; o && d<4; o=Object.getPrototypeOf(o),d++){
        var own=Object.getOwnPropertyNames(o);
        for(var i=0;i<own.length;i++) if(!NOISE[own[i]]) names[own[i]]=1;
      }
      var keys=Object.keys(names).sort(), fns=[];
      for(var j=0;j<keys.length;j++){
        var key=keys[j], p=path?path+'.'+key:key, val;
        try{ val=obj[key]; }catch(e){ out[p]='ERR:'+e.name; leaves++; continue; }
        if(typeof val==='function'){ fns.push(key); continue; } // shape, not value
        if(Array.isArray(val)){ // whole array as one leaf — no Array.prototype spam
          try{ var js=JSON.stringify(val); out[p]= js.length>MAX_ARR? js.slice(0,MAX_ARR):js; }
          catch(e){ out[p]='[array:'+val.length+']'; }
          leaves++; continue;
        }
        var s=leaf(val);
        if(s!==null){ out[p]=s; leaves++; }
        else if(depth<md) rec(val, p, depth+1);
      }
      // compact method inventory (underscore → ignored by the value comparison,
      // but preserved in raw for cross-realm shape analysis).
      if(fns.length){ out[(path?path+'.':'')+'_fns']=fns.sort().join(','); leaves++; }
    }
    rec(rootObj, label, 0);
    return out;
  }

  /* ---- ТИПИЗИРОВАННЫЙ envelope (source of truth, Codex v4 §Типизация) ----
   * encodeValue keeps native types at collection time: false ≠ "false",
   * null ≠ "null", NaN/Infinity/-0/bigint explicit, arrays stay arrays
   * (count===length), objects stay objects, Error/typed-array structured.
   * SINGLE SOURCE: lib/fp-encode.mjs, injected below and imported by the test. */
  var STATUS={ok:'ok',unsupported:'unsupported',unavailableInContext:'unavailable-in-context',
    permissionRequired:'permission-required',permissionDenied:'permission-denied',blocked:'blocked',
    timeout:'timeout',error:'error',invalidResult:'invalid-result'};
  // encodeValue / fnv1a / bytesHash are INJECTED here from lib/fp-encode.mjs by
  // the serving routes (probe + collector), so the browser runs the SAME source
  // the unit test imports — no copy to drift (Codex v4.2 #2). The injection point
  // is INSIDE COLLECTOR so COLLECTOR.toString() carries it into every worker /
  // iframe / OOPIF realm unchanged.
  /*__FP_ENCODE_INJECT__*/
  if(typeof encodeValue==='undefined'){ throw new Error('fp-encode not injected'); }
  // Typed deep-walk over a live native object → array of measurement records
  // {path,context,phase,status,valueType,value,error,meta}. Reads the SAME
  // getters as walk() but preserves native types instead of stringifying.
  function walkTyped(rootObj,label,context,phase,recs,maxDepth){
    var md=maxDepth||MAX_DEPTH, seen=(typeof WeakSet!=='undefined')?new WeakSet():null, n=0;
    function push(p,status,enc,error){
      var m={}; if(enc&&enc.special)m.special=enc.special; if(enc&&enc.count!=null)m.count=enc.count;
      recs.push({path:p,context:context,phase:phase,status:status,
        valueType:enc?enc.valueType:null,value:enc?enc.value:null,error:error||null,meta:m});
      n++;
    }
    function rec(obj,path,depth){
      if(n>=MAX_LEAVES) return;
      if(obj===null||(typeof obj!=='object'&&typeof obj!=='function')) return;
      if(seen){ if(seen.has(obj)) return; seen.add(obj); }
      var names={};
      for(var o=obj,d=0;o&&d<4;o=Object.getPrototypeOf(o),d++){
        var own=Object.getOwnPropertyNames(o);
        for(var i=0;i<own.length;i++) if(!NOISE[own[i]]) names[own[i]]=1;
      }
      var keys=Object.keys(names).sort();
      for(var j=0;j<keys.length;j++){
        var key=keys[j], p=path?path+'.'+key:key, val, threw=null;
        try{ val=obj[key]; }catch(e){ threw=e; }
        // A SecurityError from a getter is an access DENIAL (opaque/sandboxed
        // realm), not a bug — normalise to `blocked` like M() does (Codex v4.3 #2).
        if(threw){ push(p, threw.name==='SecurityError'?STATUS.blocked:STATUS.error, null, {name:threw.name,message:threw.message}); continue; }
        var tv=typeof val;
        var isSpecialObj = val && tv==='object' && (val instanceof Error ||
          (typeof ArrayBuffer!=='undefined' && (val instanceof ArrayBuffer || (ArrayBuffer.isView&&ArrayBuffer.isView(val)))));
        if(tv==='object' && val!==null && !Array.isArray(val) && !isSpecialObj && depth<md){
          rec(val,p,depth+1); continue;
        }
        push(p,STATUS.ok,encodeValue(val),null);
      }
    }
    rec(rootObj,label,0);
  }

  // Current collect() context/phase + the typed record sink. Set at the start of
  // collect(); M()/MA() push into CUR.recs while blocks run.
  var CUR={context:'main-frame',phase:'passive',recs:null};
  function nowMs(){ return (root.performance&&root.performance.now)?root.performance.now():Date.now(); }
  function pushRec(path,status,enc,error,dur){
    if(!CUR.recs) return;
    var m={durationMs:+(dur||0).toFixed(3)};
    if(enc){ if(enc.special)m.special=enc.special; if(enc.count!=null)m.count=enc.count; }
    CUR.recs.push({path:path,context:CUR.context,phase:CUR.phase,status:status,
      valueType:enc?enc.valueType:null,value:enc?enc.value:null,error:error||null,meta:m});
  }
  // A probe returns MSTATUS.x to declare an explicit non-ok status (feature not
  // in this realm, unsupported, needs permission, blocked) instead of a fake
  // value — maps to the closed status enum, value stays null.
  var MSTATUS={
    unsupported:{__mstatus:STATUS.unsupported},
    unavailable:{__mstatus:STATUS.unavailableInContext},
    permissionRequired:{__mstatus:STATUS.permissionRequired},
    permissionDenied:{__mstatus:STATUS.permissionDenied},
    blocked:{__mstatus:STATUS.blocked},
    invalid:{__mstatus:STATUS.invalidResult},
  };
  // Sync measure: emit a TYPED record AND return the legacy sentinel value so the
  // old string map keeps working. undefined → 'ok'/valueType 'undefined'; a thrown
  // probe → 'error' + structured error; an MSTATUS marker → that explicit status.
  function M(path,fn){
    var t0=nowMs(),legacy,enc=null,status=STATUS.ok,error=null;
    try{
      var v=fn();
      if(v&&typeof v==='object'&&v.__mstatus){ status=v.__mstatus; enc={valueType:'null',value:null}; legacy=v.__mstatus; }
      else { legacy=(v===undefined?'undef':v); enc=encodeValue(v); }
    }
    catch(e){
      // A SecurityError is an ACCESS DENIAL (policy / opaque origin / disabled
      // API), not a bug — normalise it to the terminal `blocked` status so a
      // restricted realm doesn't read as a broken probe (Codex v4.2 #6). Any
      // OTHER thrown error stays `error` and blocks readiness.
      status=(e&&e.name==='SecurityError')?STATUS.blocked:STATUS.error;
      error={name:e&&e.name,message:e&&e.message,stack:e&&e.stack};
      legacy='ERR:'+(e&&e.name);
    }
    pushRec(path,status,enc,error,nowMs()-t0);
    return legacy;
  }
  // Async measure (returns a Promise of the legacy value).
  function MA(path,fn){
    var t0=nowMs();
    return Promise.resolve().then(fn).then(function(v){
      pushRec(path,STATUS.ok,encodeValue(v),null,nowMs()-t0);
      return v===undefined?'undef':v;
    },function(e){
      // SecurityError → blocked (access denial, not a bug); else error (Codex #6).
      var st=(e&&e.name==='SecurityError')?STATUS.blocked:STATUS.error;
      pushRec(path,st,null,{name:e&&e.name,message:e&&e.message,stack:e&&e.stack},nowMs()-t0);
      return 'ERR:'+(e&&e.name);
    });
  }

  /* ---- глубокие цели (значения каждого свойства) ----------------------- */
  function deepBlock(){
    var m={};
    var nav = root.navigator;
    if(nav) Object.assign(m, walk(nav,'navigator'));
    var scr = root.screen;
    if(scr) Object.assign(m, walk(scr,'screen'));
    // window/self — только верхний уровень (глубокий обход утащил бы весь DOM);
    // сам список глобалей — это уже отпечаток.
    Object.assign(m, walk({ globals: (function(){ try{ return Object.getOwnPropertyNames(root).sort().join(','); }catch(e){ return 'ERR'; } })() }, 'window', 1));
    if(typeof document!=='undefined' && document){
      m['document.characterSet']=S(function(){return document.characterSet;});
      m['document.compatMode']=S(function(){return document.compatMode;});
      m['document.referrer']=S(function(){return document.referrer;});
      m['document.visibilityState']=S(function(){return document.visibilityState;});
    }
    return m;
  }

  /* ---- локаль / время -------------------------------------------------- */
  function localeBlock(){
    return {
      resolvedTZ:M('locale.resolvedTZ',function(){return Intl.DateTimeFormat().resolvedOptions().timeZone;}),
      resolvedLocale:M('locale.resolvedLocale',function(){return Intl.DateTimeFormat().resolvedOptions().locale;}),
      calendar:M('locale.calendar',function(){return Intl.DateTimeFormat().resolvedOptions().calendar;}),
      numberingSystem:M('locale.numberingSystem',function(){return Intl.DateTimeFormat().resolvedOptions().numberingSystem;}),
      tzOffset:M('locale.tzOffset',function(){return new Date().getTimezoneOffset();}),
      dtfWinter:M('locale.dtfWinter',function(){return new Date(2021,0,1).toString();}),
      dtfSummer:M('locale.dtfSummer',function(){return new Date(2021,6,1).toString();}),
      dateToLocale:M('locale.dateToLocale',function(){return new Date(0).toLocaleString();}),
      numberToLocale:M('locale.numberToLocale',function(){return (1234567.89).toLocaleString();}),
      relativeTime:M('locale.relativeTime',function(){return new Intl.RelativeTimeFormat().format(-1,'day');}),
      collator:M('locale.collator',function(){return ['ä','a','z','Z','1','ﬀ'].sort(new Intl.Collator().compare).join('');}),
      // FIX (Codex P2): actually FORMAT with ListFormat instead of returning
      // typeof — the discriminating value is the joined output, not "function".
      listFormat:M('locale.listFormat',function(){
        if(typeof Intl==='undefined'||typeof Intl.ListFormat!=='function') return undefined;
        return new Intl.ListFormat(undefined,{style:'long',type:'conjunction'}).format(['a','b','c']);
      }),
      pluralRules:M('locale.pluralRules',function(){return new Intl.PluralRules().select(2);}),
      // FIX (Codex P2): return the real firstDay, or undefined when weekInfo is
      // unsupported — the typed layer records that as valueType 'undefined',
      // no more "undef" string masquerading as a value.
      firstWeekday:M('locale.firstWeekday',function(){
        var wi=(new Intl.Locale(navigator.language)).weekInfo;
        return wi?wi.firstDay:undefined;
      }),
    };
  }

  /* ---- canvas 2D ------------------------------------------------------- */
  // A real canvas in every realm: HTMLCanvasElement in a document, OffscreenCanvas
  // in workers. Shared by the canvas and WebGL blocks.
  function makeCanvas(w,h){
    if(typeof document!=='undefined' && document.createElement){
      var c=document.createElement('canvas'); c.width=w; c.height=h; return c;
    }
    if(typeof OffscreenCanvas!=='undefined') return new OffscreenCanvas(w,h);
    return null;
  }
  // P3 (Codex): the same deterministic scene, drawn on a fresh canvas each call →
  // exact inputs, real pixels, input-length, SHA-256, THREE internal repeats and a
  // stability flag, explicit errors. Repeats run in one user visit.
  function canvasDraw(){
    var cv=makeCanvas(280,60);
    if(!cv) return {status:'unavailable'};
    var ctx=cv.getContext&&cv.getContext('2d'); if(!ctx) return {status:'unsupported'};
    ctx.textBaseline='alphabetic'; ctx.fillStyle='#f60'; ctx.fillRect(1,1,100,40);
    ctx.fillStyle='#069'; ctx.font='11pt no-real-font-123'; ctx.fillText('Cwm fjord 😀 véy',2,15);
    ctx.fillStyle='rgba(102,204,0,0.7)'; ctx.font='18pt Arial'; ctx.fillText('Cwm fjord 😀 véy',4,45);
    ctx.globalCompositeOperation='multiply';
    ctx.fillStyle='rgb(255,0,255)'; ctx.beginPath(); ctx.arc(50,25,20,0,Math.PI*2,true); ctx.fill();
    var px; try{ px=ctx.getImageData(0,0,cv.width,cv.height).data; }catch(e){ return {status:'invalid', err:e}; }
    return {status:'ok', cv:cv, ctx:ctx, px:px};
  }
  function pixFnv(px){ var s=''; for(var i=0;i<px.length;i+=97) s+=px[i]+','; return hash(s); }
  function canvasBlock(){
    return A(function(){
      var first=canvasDraw();
      if(first.status==='unavailable') return {status:M('canvas.status',function(){return MSTATUS.unavailable;})};
      if(first.status==='unsupported') return {status:M('canvas.status',function(){return MSTATUS.unsupported;})};
      if(first.status==='invalid') return {status:M('canvas.status',function(){ throw first.err; })};
      var px=first.px, cv=first.cv;
      // 3 internal repeats → stability/variance
      var fnvs=[pixFnv(px)];
      for(var rr=0; rr<2; rr++){ var d=canvasDraw(); fnvs.push(d.px?pixFnv(d.px):null); }
      var stable = fnvs[0]===fnvs[1] && fnvs[1]===fnvs[2];
      var winding=M('canvas.winding',function(){ return first.ctx.isPointInPath(5,5,'evenodd'); });
      var encP;
      if(cv.toDataURL){ var du=S(function(){return cv.toDataURL();}); encP=Promise.resolve((typeof du==='string'&&du.indexOf('data:')===0)?{fmt:'dataURL',len:du.length}:{fmt:'err',len:0}); }
      else if(cv.convertToBlob){ encP=cv.convertToBlob().then(function(b){return {fmt:'blob',len:b.size};},function(){return {fmt:'err',len:0};}); }
      else encP=Promise.resolve({fmt:'none',len:0});
      return Promise.all([sha256(px), encP]).then(function(r){
        M('canvas.width',function(){return cv.width;});
        M('canvas.height',function(){return cv.height;});
        M('canvas.pixelBytes',function(){return px.length;});        // input length
        M('canvas.pixelFnv',function(){return fnvs[0];});
        M('canvas.pixelSha256',function(){return r[0]||undefined;}); // raw output digest
        M('canvas.encFmt',function(){return r[1].fmt;});
        M('canvas.encLen',function(){return r[1].len;});
        M('canvas.repeats',function(){return fnvs;});                // array of 3 (Codex: repeats)
        M('canvas.stable',function(){return stable;});               // stability/variance
        return { status:'ok', width:cv.width, height:cv.height, winding:winding,
          pixelBytes:px.length, pixelFnv:fnvs[0], pixelSha256:r[0]||'n/a',
          encFmt:r[1].fmt, encLen:r[1].len, repeats:fnvs.join(','), stable:String(stable) };
      });
    });
  }

  /* ---- WebGL / WebGL2 — исчерпывающе --------------------------------- */
  var GL_PARAMS=['ACTIVE_TEXTURE','ALIASED_LINE_WIDTH_RANGE','ALIASED_POINT_SIZE_RANGE',
    'ALPHA_BITS','BLUE_BITS','DEPTH_BITS','GREEN_BITS','RED_BITS','STENCIL_BITS',
    'MAX_COMBINED_TEXTURE_IMAGE_UNITS','MAX_CUBE_MAP_TEXTURE_SIZE','MAX_FRAGMENT_UNIFORM_VECTORS',
    'MAX_RENDERBUFFER_SIZE','MAX_TEXTURE_IMAGE_UNITS','MAX_TEXTURE_SIZE','MAX_VARYING_VECTORS',
    'MAX_VERTEX_ATTRIBS','MAX_VERTEX_TEXTURE_IMAGE_UNITS','MAX_VERTEX_UNIFORM_VECTORS',
    'MAX_VIEWPORT_DIMS','RENDERER','SHADING_LANGUAGE_VERSION','VENDOR','VERSION',
    'MAX_TEXTURE_MAX_ANISOTROPY_EXT',
    // WebGL2
    'MAX_3D_TEXTURE_SIZE','MAX_ARRAY_TEXTURE_LAYERS','MAX_COLOR_ATTACHMENTS',
    'MAX_COMBINED_FRAGMENT_UNIFORM_COMPONENTS','MAX_COMBINED_UNIFORM_BLOCKS',
    'MAX_COMBINED_VERTEX_UNIFORM_COMPONENTS','MAX_DRAW_BUFFERS','MAX_ELEMENT_INDEX',
    'MAX_ELEMENTS_INDICES','MAX_ELEMENTS_VERTICES','MAX_FRAGMENT_INPUT_COMPONENTS',
    'MAX_FRAGMENT_UNIFORM_BLOCKS','MAX_FRAGMENT_UNIFORM_COMPONENTS','MAX_PROGRAM_TEXEL_OFFSET',
    'MAX_SAMPLES','MAX_TEXTURE_LOD_BIAS','MAX_TRANSFORM_FEEDBACK_SEPARATE_ATTRIBS',
    'MAX_UNIFORM_BLOCK_SIZE','MAX_UNIFORM_BUFFER_BINDINGS','MAX_VARYING_COMPONENTS',
    'MAX_VERTEX_OUTPUT_COMPONENTS','MAX_VERTEX_UNIFORM_BLOCKS','MAX_VERTEX_UNIFORM_COMPONENTS'];
  // Render a scene and read the pixels back — what the GPU+driver actually
  // produce, distinct from what getParameter claims. Returns the raw pixels so
  // the caller can hash them (FNV sync + SHA-256), plus compile/link/gl status.
  function glRender(gl){
    try{
      var vs=gl.createShader(gl.VERTEX_SHADER);
      gl.shaderSource(vs,'attribute vec2 p;varying vec2 v;void main(){v=p;gl_Position=vec4(p,0.0,1.0);}');
      gl.compileShader(vs);
      var vsOk=gl.getShaderParameter(vs,gl.COMPILE_STATUS);
      var fs=gl.createShader(gl.FRAGMENT_SHADER);
      gl.shaderSource(fs,'precision highp float;varying vec2 v;void main(){gl_FragColor=vec4(abs(sin(v.x*12.0)),abs(cos(v.y*9.0)),fract(v.x*v.y*7.0),1.0);}');
      gl.compileShader(fs);
      var fsOk=gl.getShaderParameter(fs,gl.COMPILE_STATUS);
      var pr=gl.createProgram(); gl.attachShader(pr,vs); gl.attachShader(pr,fs); gl.linkProgram(pr);
      var linkOk=gl.getProgramParameter(pr,gl.LINK_STATUS); gl.useProgram(pr);
      var buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
      var loc=gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
      var w=gl.drawingBufferWidth,h=gl.drawingBufferHeight;
      var px=new Uint8Array(w*h*4); gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,px);
      return { ok:true, w:w, h:h, px:px, compile:(vsOk&&fsOk?'ok':'fail'), link:(linkOk?'ok':'fail'), glError:gl.getError() };
    }catch(e){ return { ok:false, error:'ERR:'+e.name }; }
  }
  function glContext(name){
    var cv=makeCanvas(64,64); if(!cv||!cv.getContext) return null;
    try{ return cv.getContext(name); }catch(e){ return null; }
  }
  function glFnv(px,w,h){ var s=''; for(var i=0;i<px.length;i+=131) s+=px[i]; return hash(s+'|'+w+'x'+h); }
  function glBlock(){
    return A(function(){
      var out={}, jobs=[];
      // A FRESH canvas per context type — one canvas can't hand out both webgl
      // and webgl2, which is why webgl1 used to come back "n/a".
      ['webgl2','webgl'].forEach(function(name){
        var gl=glContext(name);
        if(!gl){ out[name]={status:M('webgl.'+name+'.status',function(){return MSTATUS.unsupported;})}; return; }
        var dbg=null; try{ dbg=gl.getExtension('WEBGL_debug_renderer_info'); }catch(e){}
        var g={};
        GL_PARAMS.forEach(function(k){ if(gl[k]!==undefined) g[k]=M('webgl.'+name+'.params.'+k,function(){ var v=gl.getParameter(gl[k]); return (v&&v.length!==undefined&&typeof v!=='string')?Array.prototype.slice.call(v).join(','):v; }); });

function rstat(name,status,detail){ if(!REALM_STATUS[name]||REALM_STATUS[name].status!=='finished') REALM_STATUS[name]={status:status,detail:detail||null}; }

// send() MUST reject on HTTP non-2xx AND on network failure (Codex v4.2 #5): a
// silently-swallowed failure was how a half-saved run looked "done". Callers that
// must not hang still use .then(res,res); the failure is recorded in SENDLOG.
function send(context,m){
  return fetch(COLLECT_URL,{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({context:context,m:m})}).then(function(r){
      SENDLOG.push({context:context,ok:r.ok,status:r.status});
      if(!r.ok){ log('  ✗ '+context+' '+r.status,'err'); throw new Error('http-'+r.status); }
      log('  ✓ '+context+' ('+Object.keys(m).length+' параметров)','ok');
      return r;
    },function(e){
      SENDLOG.push({context:context,ok:false,status:0,error:String(e&&e.message||e)});
      log('  ✗ '+context+': '+(e&&e.message||e),'err');
      throw e;
    });
}
function blobURL(src){ return URL.createObjectURL(new Blob([src],{type:'text/javascript'})); }

// The audio-worklet realm posts a flat map (it can't run the M() pipeline). Type
// it on the main thread, classifying the worklet's sentinels into real statuses.
function typifyWorklet(m, context){
  var recs=[], enc=(self.LinkageProbe&&self.LinkageProbe.encodeValue)||null;
  Object.keys(m).forEach(function(k){
    if(k==='_context'||k==='_measurements'||k==='_schema') return;
    var v=m[k], status='ok', err=null, ev={valueType:'string',value:v};
    if(v==='unavailable-in-context'){ status='unavailable-in-context'; ev={valueType:'null',value:null}; }
    else if(v==='undef'){ ev={valueType:'undefined',value:null}; }
    else if(typeof v==='string' && v.indexOf('ERR:')===0){ status='error'; err={name:v.slice(4),message:''}; ev={valueType:null,value:null}; }
    else if(enc){ ev=enc(v); }
    var meta={}; if(ev.special)meta.special=ev.special; if(ev.count!=null)meta.count=ev.count;
    recs.push({path:k,context:context,phase:'passive',status:status,valueType:ev.valueType,value:ev.value,error:err,meta:meta});
  });
  return recs;
}

// kind: dedicated-worker | shared-worker (+ '-module' variants). Module workers
// are a distinct realm (module scope) worth capturing separately (Codex P4).
function viaWorker(kind){
  var shared = kind.indexOf('shared')===0;
  var module = /-module$/.test(kind);
  return new Promise(function(res){
    var t=setTimeout(function(){ rstat(kind,'timeout'); log('  ! '+kind+' timeout','err'); res(); },20000);
    try{
      var url=blobURL(COLLECTOR_SRC+'\n'+WORKER_SRC.replace(/__KIND__/g,kind));
      var opts = module ? {type:'module'} : undefined;
      var w = shared?new SharedWorker(url,opts):new Worker(url,opts);
      var port = shared?(w.port.start(),w.port):w;
      port.onmessage=function(e){ clearTimeout(t); if(w.terminate)w.terminate(); send(kind,e.data).then(function(){rstat(kind,'finished');res();},function(){rstat(kind,'error','send');res();}); };
      port.postMessage('go');
    }catch(e){ clearTimeout(t); rstat(kind,'error',e.message); log('  ! '+kind+': '+e.message,'err'); res(); }
  });
}
function viaWorklet(){
  return (async function(){
    try{
      // OfflineAudioContext, NOT a realtime AudioContext: a realtime context
      // opened without a user gesture stays 'suspended' (autoplay policy), its
      // render loop never runs, the processor is never constructed and 'go' is
      // never serviced — the worklet realm was silently lost to a 12s timeout.
      // Offline rendering runs deterministically with no gesture requirement.
      var OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
      if(!OAC){ rstat('audio-worklet','unsupported','no OfflineAudioContext'); log('  ! audio-worklet: no OfflineAudioContext','err'); return; }
      var ac=new OAC(1,128,44100);
      await ac.audioWorklet.addModule(blobURL(WORKLET_SRC));
      var n=new AudioWorkletNode(ac,'probe');
      n.connect(ac.destination);
      var m=await new Promise(function(res,rej){
        n.port.onmessage=function(e){res(e.data);};
        n.port.postMessage('go');
        ac.startRendering();               // drives the quantum → processor runs
        setTimeout(function(){rej(new Error('timeout'));},12000);
      });
      try{ m._measurements=typifyWorklet(m,'audio-worklet'); m._schema='typed-v4-partial'; }catch(_){}
      await send('audio-worklet',m); rstat('audio-worklet','finished');
    }catch(e){ rstat('audio-worklet', e&&e.message==='timeout'?'timeout':'error', e&&e.message); log('  ! audio-worklet: '+e.message,'err'); }
  })();
}

// iframe — тот же сбор в собственном окне фрейма. Дешёвые антики патчат
// главное окно и забывают про фреймы: тогда значения в iframe совпадут с
// обычным браузером = утечка. Same-origin srcdoc, результат через postMessage.
// srcdoc iframe realms. opts: { sandbox:'<flags>'|null, credentialless:bool }.
// context names: iframe (same-origin) | sandboxed-iframe | credentialless-iframe.
// The realm's own isolation metadata (sandbox flags, origin) is recorded so a
// same-site subframe isn't mistaken for a cross-process OOPIF (Codex P4).
function viaIframeVariant(context, opts){
  opts=opts||{};
  return new Promise(function(res){
    try{
      var ifr=document.createElement('iframe');
      ifr.style.cssText='position:absolute;left:-9999px;width:120px;height:120px;border:0';
      // Delegate the Permissions-Policy features the probe measures so a
      // same-origin subframe can actually run them (WebGPU especially) instead of
      // a policy-blocked realm. Ignored for the opaque-origin sandboxed frame.
      try{ ifr.setAttribute('allow','webgpu *; gamepad *; accelerometer *; gyroscope *; magnetometer *'); }catch(_){}
      if(opts.sandbox!=null) ifr.setAttribute('sandbox',opts.sandbox);
      if(opts.credentialless){ try{ ifr.credentialless=true; }catch(_){} }
      var meta='{_isolation:{context:"'+context+'",sandbox:'+(opts.sandbox!=null?JSON.stringify(opts.sandbox):'null')+',credentialless:'+(!!opts.credentialless)+',origin:(location&&location.origin)||"opaque"}}';
      ifr.srcdoc='<!doctype html><body><script>'+COLLECTOR_SRC+
        'function P(o){try{parent.postMessage({__fp:1,m:o},"*");}catch(_e){try{parent.postMessage({__fp:1,m:JSON.parse(JSON.stringify(o))},"*");}catch(_e2){parent.postMessage({__fp:1,m:{_context:"'+context+'",error:"post-failed:"+String(_e&&_e.name)}},"*");}}}'+
        'self.LinkageProbe.collect("'+context+'").then(function(m){try{m._isolation='+meta+'._isolation;}catch(e){}P(m);},'+
        'function(e){P({_context:"'+context+'",error:String(e)});});<\/script>';
      var t=setTimeout(function(){ cleanup(); rstat(context,'timeout'); log('  ! '+context+' timeout','err'); res(); },30000);
      function onmsg(e){ if(e&&e.source===ifr.contentWindow&&e.data&&e.data.__fp){ cleanup(); send(context,e.data.m).then(function(){rstat(context,'finished');res();},function(){rstat(context,'error','send');res();}); } }
      function cleanup(){ clearTimeout(t); window.removeEventListener('message',onmsg); try{ ifr.remove(); }catch(_){} }
      window.addEventListener('message',onmsg);
      document.body.appendChild(ifr);
    }catch(e){ rstat(context,'error',e.message); log('  ! '+context+': '+e.message,'err'); res(); }
  });
}
function viaIframe(){ return viaIframeVariant('iframe',{sandbox:'allow-same-origin allow-scripts'}); }
// Real-URL same-origin frame (not srcdoc) — served by /fingerprint/frame.
function viaIframeUrl(){
  return new Promise(function(res){
    try{
      var ifr=document.createElement('iframe');
      ifr.style.cssText='position:absolute;left:-9999px;width:120px;height:120px;border:0';
      try{ ifr.setAttribute('allow','webgpu *; gamepad *; accelerometer *; gyroscope *; magnetometer *'); }catch(_){}
      ifr.src='/fingerprint/frame';
      var t=setTimeout(function(){ cleanup(); rstat('iframe-url','timeout'); log('  ! iframe-url timeout','err'); res(); },30000);
      function onmsg(e){ if(e&&e.source===ifr.contentWindow&&e.data&&e.data.__fp){ cleanup(); send('iframe-url',e.data.m).then(function(){rstat('iframe-url','finished');res();},function(){rstat('iframe-url','error','send');res();}); } }
      function cleanup(){ clearTimeout(t); window.removeEventListener('message',onmsg); try{ ifr.remove(); }catch(_){} }
      window.addEventListener('message',onmsg);
      document.body.appendChild(ifr);
    }catch(e){ rstat('iframe-url','error',e.message); log('  ! iframe-url: '+e.message,'err'); res(); }
  });
}
function viaSandboxedIframe(){ return viaIframeVariant('sandboxed-iframe',{sandbox:'allow-scripts'}); }        // opaque origin
function viaCredentiallessIframe(){ return viaIframeVariant('credentialless-iframe',{sandbox:'allow-same-origin allow-scripts',credentialless:true}); }

// service-worker: ещё один realm. SW отдаётся роутом /fingerprint/sw (тот же
// COLLECTOR). У SW нет fetch-обработчика — трафик не перехватывает; после снятия
// снимаем регистрацию. Отвечает на 'go' снимком через MessageChannel-порт.
function viaServiceWorker(){
  return (async function(){
    if(!('serviceWorker' in navigator)){ rstat('service-worker','unsupported','no serviceWorker'); log('  ! нет serviceWorker','err'); return; }
    var reg;
    try{
      reg=await navigator.serviceWorker.register('/fingerprint/sw',{scope:'/fingerprint/'});
      // дождаться активного воркера
      var sw=reg.active||reg.waiting||reg.installing;
      if(sw && sw.state!=='activated'){
        await new Promise(function(res){ var t=setTimeout(res,8000); sw.addEventListener('statechange',function(){ if(sw.state==='activated'){ clearTimeout(t); res(); } }); });
      }
      var target=reg.active||navigator.serviceWorker.controller;
      if(!target){ rstat('service-worker','timeout','not activated'); log('  ! SW не активировался','err'); try{await reg.unregister();}catch(_){}; return; }
      var m=await new Promise(function(res,rej){
        var ch=new MessageChannel();
        ch.port1.onmessage=function(e){ res(e.data); };
        target.postMessage('go',[ch.port2]);
        setTimeout(function(){ rej(new Error('timeout')); },15000);
      });
      await send('service-worker',m); rstat('service-worker','finished');
    }catch(e){ rstat('service-worker', e&&e.message==='timeout'?'timeout':'error', e&&e.message); log('  ! service-worker: '+e.message,'err'); }
    finally{ try{ if(reg) await reg.unregister(); }catch(_){} }
  })();
}

// cross-origin OOPIF: iframe на fp-origin (/xprobe у приёмника) — настоящий
// другой сайт. Страница гоняет тот же COLLECTOR и постит нам результат.
function viaCrossOrigin(){
  return (async function(){
    var ifr;
    try{
      var r=await fetch('/api/fingerprint/xprobe-url'); if(!r.ok){ rstat('cross-origin-iframe','unsupported','not deployed ('+r.status+')'); return; } // 503 = не развёрнут
      var j=await r.json(); if(!j.url){ rstat('cross-origin-iframe','unsupported','no url'); return; }
      ifr=document.createElement('iframe');
      ifr.style.cssText='position:absolute;left:-9999px;width:120px;height:120px;border:0';
      try{ ifr.setAttribute('allow','webgpu *; gamepad *; accelerometer *; gyroscope *; magnetometer *'); }catch(_){}
      ifr.src=j.url;
      // Expected child origin from the returned URL — verify event.origin against
      // it and record BOTH origins (Codex v4.3 #9): a true cross-site OOPIF.
      var childOrigin=''; try{ childOrigin=new URL(j.url).origin; }catch(_){}
      var m=await new Promise(function(res,rej){
        var done=false;
        function onmsg(e){
          // must come from OUR iframe AND from the expected cross-site origin.
          if(e&&e.source===ifr.contentWindow&&e.origin===childOrigin&&e.data&&e.data.__fpx){
            done=true; clearTimeout(tmo); window.removeEventListener('message',onmsg);
            var data=e.data.m||{};
            try{ data._crossOrigin={ parentOrigin:location.origin, childOrigin:e.origin, eventOriginVerified:true,
              crossSite:(function(){ try{ return new URL(location.origin).hostname.split('.').slice(-2).join('.')!==new URL(e.origin).hostname.split('.').slice(-2).join('.'); }catch(_){ return null; } })() }; }catch(_){}
            res(data);
          }
        }
        window.addEventListener('message',onmsg);
        document.body.appendChild(ifr);
        var tmo=setTimeout(function(){ if(!done){ window.removeEventListener('message',onmsg); rej(new Error('timeout')); } },30000);
      });
      await send('cross-origin-iframe',m); rstat('cross-origin-iframe','finished');
    }catch(e){ rstat('cross-origin-iframe', e&&e.message==='timeout'?'timeout':'error', e&&e.message); log('  ! cross-origin: '+e.message,'err'); }
    finally{ try{ if(ifr) ifr.remove(); }catch(_){} }
  })();
}

// Сетевой слой (JA4): дёргаем приёмник из ЭТОЙ же вкладки — само TLS-рукопожатие
// к нему и есть замер. Токен просим у панели (тот же origin), приёмник кросс-
// оригинный, поэтому no-cors: ответ не читаем, но соединение и запрос уходят.
async function netLayer(){
  try{
    var qs=new URLSearchParams(location.search);
    var env=qs.get('env'), sid=qs.get('sid');
    if(!env) return;
    // Two-phase Accept-CH/Critical-CH (Codex v4.3 #8): round 1 primes (server sends
    // Accept-CH); after a short gap the browser has cached it, so round 2 carries
    // the high-entropy hints. Each round is its own TLS connection → own JA4.
    async function fireRound(round){
      var tokUrl='/api/fingerprint/net-token?env='+encodeURIComponent(env)+(sid?'&sid='+encodeURIComponent(sid):'')+'&round='+round;
      var r=await fetch(tokUrl,{method:'POST'});
      if(!r.ok){ if(round===1) rstat('network','unsupported','net-token '+r.status); return false; }
      var j=await r.json(); if(!j.url){ if(round===1) rstat('network','unsupported','no url'); return false; }
      await new Promise(function(res){
        var done=false, fin=function(){ if(done)return; done=true; res(); };
        try{ fetch(j.url,{mode:'no-cors',cache:'no-store'}).then(fin,fin); }catch(e){ fin(); }
        setTimeout(fin,8000);
      });
      return true;
    }
    var ok1=await fireRound(1);
    if(!ok1) return;
    await new Promise(function(r){ setTimeout(r,1500); });   // let the browser cache Accept-CH
    await fireRound(2);
    // no-cors: the ack lands server→server (capture → panel); the server confirms
    // persistence in the side-status check before "готово".
    rstat('network','fired');
    log('  ✓ сетевой слой (JA4, 2-phase Accept-CH)','ok');
  }catch(e){ rstat('network','error', e&&e.message); }
}

// Permissioned phase (optional, gesture-gated): geo / device labels / permission
// states behind browser prompts. Never blocks the passive snapshot. Geo is kept
// privacy-safe — accuracy + permission state + a HASH of coarse coords (so admin
// can see if location differs plain-vs-anti WITHOUT storing the real address).
// Permissioned phase (gesture-gated), rebuilt per Codex v4.2 #8:
//  · permission STATES before AND after (a `prompt` is NOT `granted`);
//  · a REAL getUserMedia({audio,video}) prompt, then per-track settings/
//    capabilities/constraints, then tracks STOPPED;
//  · enumerateDevices before vs after (labels reveal on grant), typed per-device
//    kind/label/deviceId/groupId;
//  · geolocation stored TYPED (lat/lon/accuracy/altitude/altitudeAccuracy/heading/
//    speed/timestamp) with a coarse bucket kept only as an extra human field;
//  · a manifest reconciling requested vs granted/denied/prompt/timeout/unsupported,
//    with `complete` only when every requested step reached a terminal state.
function permissionedCollect(){
  return (async function(){
    var out={ _context:'permissioned', _schema:'typed-v4-partial' };
    var recs=[];
    var manifest={ phase:'permissioned', requested:[], granted:[], denied:[], prompt:[], timeout:[], unsupported:[], steps:{}, complete:false };
    var enc=(self.LinkageProbe&&self.LinkageProbe.encodeValue)||function(v){return {valueType:typeof v,value:v};};
    function rec(path,status,value,err){ var e=(value===undefined)?{valueType:'undefined',value:null}:(value===null?{valueType:'null',value:null}:enc(value));
      recs.push({path:path,context:'permissioned',phase:'permissioned',status:status,valueType:e.valueType,value:e.value,error:err||null,meta:{}}); }
    var np=navigator.permissions, permNames=['geolocation','camera','microphone','notifications'];
    async function queryState(name){ try{ var r=await np.query({name:name}); return r.state; }catch(e){ return 'unsupported'; } }

    // 1. permission STATES before (a 'prompt' state is NOT 'granted')
    if(np&&np.query){ for(var i=0;i<permNames.length;i++){ manifest.requested.push('perm.'+permNames[i]);
      var sb=await queryState(permNames[i]); rec('permissioned.perm.'+permNames[i]+'.before','ok',sb); } }

    // 2. enumerateDevices BEFORE gUM (labels hidden until granted)
    async function enumerate(tag){
      if(!(navigator.mediaDevices&&navigator.mediaDevices.enumerateDevices)) return null;
      try{ var list=await navigator.mediaDevices.enumerateDevices();
        var withLabels=list.filter(function(d){return d.label;}).length;
        rec('permissioned.devices.'+tag+'.count','ok',list.length);
        rec('permissioned.devices.'+tag+'.withLabels','ok',withLabels);
        list.forEach(function(d,idx){
          rec('permissioned.devices.'+tag+'['+idx+'].kind','ok',d.kind);
          rec('permissioned.devices.'+tag+'['+idx+'].label','ok',d.label||'');
          rec('permissioned.devices.'+tag+'['+idx+'].deviceId','ok',d.deviceId||'');
          rec('permissioned.devices.'+tag+'['+idx+'].groupId','ok',d.groupId||'');
        });
        return {count:list.length, withLabels:withLabels};
      }catch(e){ rec('permissioned.devices.'+tag,'error',null,{name:e.name,message:e.message}); return null; }
    }
    manifest.requested.push('enumerateDevices');
    var devBefore=await enumerate('before'); manifest.steps.enumerateBefore=!!devBefore;

    // 3. getUserMedia({audio,video}) — the REAL prompt; capture then stop tracks
    manifest.requested.push('getUserMedia');
    var gumState='unsupported';
    if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
      try{
        var stream=await new Promise(function(resolve,reject){
          var t=setTimeout(function(){reject(new Error('timeout'));},20000);
          navigator.mediaDevices.getUserMedia({audio:true,video:true}).then(function(s){clearTimeout(t);resolve(s);},function(e){clearTimeout(t);reject(e);});
        });
        gumState='granted'; manifest.granted.push('getUserMedia');
        stream.getTracks().forEach(function(tr,idx){
          rec('permissioned.track['+idx+'].kind','ok',tr.kind);
          rec('permissioned.track['+idx+'].label','ok',tr.label||'');
          try{ rec('permissioned.track['+idx+'].settings','ok', tr.getSettings?tr.getSettings():null); }catch(e){}
          try{ rec('permissioned.track['+idx+'].capabilities','ok', tr.getCapabilities?tr.getCapabilities():null); }catch(e){}
          try{ rec('permissioned.track['+idx+'].constraints','ok', tr.getConstraints?tr.getConstraints():null); }catch(e){}
          try{ tr.stop(); }catch(e){}                    // release camera/mic
        });
      }catch(e){
        var nm=e&&e.name;
        if(nm==='NotAllowedError'||nm==='SecurityError'){ gumState='denied'; manifest.denied.push('getUserMedia'); rec('permissioned.getUserMedia','permission-denied',null,{name:nm,message:e.message}); }
        else if(e&&e.message==='timeout'){ gumState='timeout'; manifest.timeout.push('getUserMedia'); rec('permissioned.getUserMedia','timeout',null); }
        else if(nm==='NotFoundError'||nm==='OverconstrainedError'){ gumState='no-device'; manifest.unsupported.push('getUserMedia'); rec('permissioned.getUserMedia','unavailable-in-context',null,{name:nm,message:e.message}); }
        else { gumState='error'; rec('permissioned.getUserMedia','error',null,{name:nm,message:e&&e.message}); }
      }
    } else { manifest.unsupported.push('getUserMedia'); rec('permissioned.getUserMedia','unavailable-in-context',null); }
    rec('permissioned.getUserMedia.result','ok',gumState); manifest.steps.getUserMedia=gumState;

    // 4. enumerateDevices AFTER — labels now visible if granted
    var devAfter=await enumerate('after'); manifest.steps.enumerateAfter=!!devAfter;
    if(devBefore&&devAfter) rec('permissioned.devices.labelsRevealed','ok', (devAfter.withLabels>devBefore.withLabels));

    // 5. geolocation — TYPED coords + coarse bucket as an extra human field
    manifest.requested.push('geolocation');
    if(navigator.geolocation){
      var geo=await new Promise(function(res){ var t=setTimeout(function(){res({s:'timeout'});},15000);
        navigator.geolocation.getCurrentPosition(function(p){ clearTimeout(t); res({s:'ok', c:p.coords, ts:p.timestamp}); },
          function(err){ clearTimeout(t); res({s:err.code===1?'denied':err.code===3?'timeout':err.code===2?'unavailable':'error', code:err.code, msg:err.message}); },
          {timeout:12000, maximumAge:0, enableHighAccuracy:true}); });
      if(geo.s==='ok'){
        var c=geo.c;
        ['latitude','longitude','accuracy','altitude','altitudeAccuracy','heading','speed'].forEach(function(k){
          var v=c[k]; rec('permissioned.geo.'+k, (v===null||v===undefined)?'unavailable-in-context':'ok', (v===null||v===undefined)?null:v); });
        rec('permissioned.geo.timestamp','ok',geo.ts);
        var r1=function(n){return Math.round(n*10)/10;};
        rec('permissioned.geo.coarseBucket','ok', LinkageProbe.hash(r1(c.latitude)+','+r1(c.longitude)));  // extra human field only
        manifest.granted.push('geolocation'); manifest.steps.geolocation='granted';
      } else if(geo.s==='denied'){ rec('permissioned.geo','permission-denied',null); manifest.denied.push('geolocation'); manifest.steps.geolocation='denied'; }
      else if(geo.s==='timeout'){ rec('permissioned.geo','timeout',null); manifest.timeout.push('geolocation'); manifest.steps.geolocation='timeout'; }
      // POSITION_UNAVAILABLE (code 2) is an environment outcome, not a collector
      // bug → unavailable-in-context (an enumerated allowed state), never `error`.
      else if(geo.s==='unavailable'){ rec('permissioned.geo','unavailable-in-context',null,{name:'GeolocationError',message:String(geo.code)}); manifest.unsupported.push('geolocation'); manifest.steps.geolocation='unavailable'; }
      else { rec('permissioned.geo','error',null,{name:'GeolocationError',message:String(geo.code)}); manifest.steps.geolocation='error'; }
    } else { rec('permissioned.geo','unavailable-in-context',null); manifest.unsupported.push('geolocation'); manifest.steps.geolocation='unsupported'; }

    // 6. permission STATES after (capture the transition; prompt != granted)
    if(np&&np.query){ for(var j=0;j<permNames.length;j++){ var sa=await queryState(permNames[j]); rec('permissioned.perm.'+permNames[j]+'.after','ok',sa);
      if(sa==='granted'){ if(manifest.granted.indexOf('perm.'+permNames[j])<0) manifest.granted.push('perm.'+permNames[j]); }
      else if(sa==='denied'){ if(manifest.denied.indexOf('perm.'+permNames[j])<0) manifest.denied.push('perm.'+permNames[j]); }
      else if(sa==='prompt'){ manifest.prompt.push('perm.'+permNames[j]); }
      else { manifest.unsupported.push('perm.'+permNames[j]); }
    } }

    // 7. complete = every requested step reached a TERMINAL state (grant/deny/…),
    //    NOT merely that a record exists.
    manifest.complete = manifest.steps.enumerateBefore===true && manifest.steps.enumerateAfter===true
      && !!manifest.steps.getUserMedia && !!manifest.steps.geolocation;
    rec('permissioned.phase.complete','ok',manifest.complete);

    out._measurements=recs; out._phaseManifest=manifest;
    return out;
  })();
}

(async function(){
  log('идёт сбор…','big');
  try{ await send('main-frame', await LinkageProbe.collect('main-frame')); rstat('main-frame','finished'); }catch(e){ rstat('main-frame','error',e.message); log('main-frame: '+e.message,'err'); }
  await viaWorker('dedicated-worker');
  await viaWorker('dedicated-worker-module');
  await viaWorker('shared-worker');
  await viaWorker('shared-worker-module');
  await viaWorklet();
  await viaIframe();
  await viaIframeUrl();
  await viaSandboxedIframe();
  await viaCredentiallessIframe();
  await viaServiceWorker();
  await viaCrossOrigin();
  await netLayer();
  // Permissioned phase is REQUIRED and comes BEFORE "готово": the browser prompts
  // (geo / camera+mic device labels) need a user gesture, so we surface a
  // mandatory button and only declare done AFTER it completes.
  log('Остался один обязательный шаг — нажми кнопку ниже ↓','big');
  var wrap=document.createElement('div'); wrap.style.cssText='margin-top:16px';
  var hint=document.createElement('div');
  hint.style.cssText='font:13px system-ui;margin-bottom:8px;color:#c9d1d9';
  hint.innerHTML='⚠️ <b>Обязательно:</b> нажми и разреши гео и устройства во всплывающих окнах — без этого сбор неполный.';
  var btn=document.createElement('button');
  btn.textContent='📍 Разрешить гео и устройства (обязательно)';
  btn.style.cssText='padding:10px 16px;font:14px system-ui;cursor:pointer';
  // Every realm the run attempts. The terminal manifest records a status for each
  // (finished/timeout/blocked/unsupported/error) — presence of one line is NOT
  // completion (Codex v4.2 #5). credentialless-iframe is Chrome-only, so it's
  // expected-optional and doesn't block "готово" when unsupported.
  var EXPECTED=['main-frame','dedicated-worker','dedicated-worker-module','shared-worker','shared-worker-module',
    'audio-worklet','iframe','iframe-url','sandboxed-iframe','credentialless-iframe','service-worker','cross-origin-iframe','network','permissioned'];
  function buildManifest(){
    var acks={}; SENDLOG.forEach(function(s){ if(!acks[s.context])acks[s.context]={ok:false,last:s.status}; if(s.ok)acks[s.context].ok=true; acks[s.context].last=s.status; });
    var realms={};
    EXPECTED.forEach(function(r){
      var st=REALM_STATUS[r];
      if(st) realms[r]=st;
      else if(acks[r]&&acks[r].ok) realms[r]={status:'finished'};
      else realms[r]={status:'missing'};
    });
    return { _context:'run-manifest', expected:EXPECTED, realms:realms, acks:acks, sendLog:SENDLOG,
      builtAt:(new Date()).toISOString(), collectorVersion:(self.LinkageProbe&&self.LinkageProbe.version)||null };
  }
  function finishAndReport(){
    // Post the terminal manifest, then ASK THE SERVER whether every canonically
    // expected context (incl. the persisted network record) actually landed —
    // «готово» requires the server's confirmation, not the client's own manifest
    // (Codex v4.3 #1). A landed first line is never "done".
    var man=buildManifest();
    return send('run-manifest', man).then(function(){
      var qs=new URLSearchParams(location.search), env=qs.get('env'), sid=qs.get('sid');
      if(!env||!sid){ log('готово локально (сессия без env/sid — НЕ боевой снимок)','err'); return false; }
      return fetch('/api/fingerprint/side-status?env='+encodeURIComponent(env)+'&sid='+encodeURIComponent(sid),{cache:'no-store'})
        .then(function(r){ if(!r.ok) throw new Error('side-status '+r.status); return r.json(); })
        .then(function(st){
          if(st&&st.complete){ log('готово — сервер подтвердил полный сбор этой стороны ('+(st.present?st.present.length:'?')+' контекстов), можно закрывать вкладку','big'); return true; }
          log('сбор записан, но сервер НЕ подтвердил полноту — не хватает: '+((st&&st.missing)||[]).join(', ')+' — это НЕ боевой снимок','err'); return false;
        });
    });
  }
  btn.onclick=function(){ btn.disabled=true; btn.textContent='снимаю…';
    permissionedCollect().then(function(m){ return send('permissioned',m); }).then(function(){
      rstat('permissioned','finished');
      btn.textContent='записываю итог…';
      return finishAndReport();
    }).then(function(serverConfirmed){
      btn.textContent = serverConfirmed ? '✓ готово (подтверждено сервером)' : 'сбор неполный — см. лог, нажми ещё раз';
      if(!serverConfirmed) btn.disabled=false;
    }, function(e){
      rstat('permissioned', REALM_STATUS['permissioned']?REALM_STATUS['permissioned'].status:'error', e&&e.message);
      btn.textContent='не удалось (сеть?) — нажми ещё раз'; btn.disabled=false;
      log('  ✗ не удалось записать итог: '+(e&&e.message||e),'err');
    });
  };
  wrap.appendChild(hint); wrap.appendChild(btn);
  logEl.parentNode.insertBefore(wrap, logEl.nextSibling);
})();
</script>
